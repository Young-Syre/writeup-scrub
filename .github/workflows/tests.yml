name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install .

      # The whole suite is offline -- the retirement check is tested with a
      # mocked fetcher, so no job needs network access or an API token.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Self-check (the tool scans its own fixtures)
        run: |
          writeup-scrub rules
          writeup-scrub scan tests/fixtures/ws001_hashes_negative.md
          writeup-scrub scan tests/fixtures/ws002_secrets_negative.md
